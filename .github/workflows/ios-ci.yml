name: iOS
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache /node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: Install npm dependencies
        run: yarn --frozen-lockfile
      # Boost moved its release archives off JFrog, so the old URL in this podspec
      # no longer serves the tarball and pod install fails the checksum check.
      - name: Point boost podspec at archives.boost.io
        run: sed -i '' 's#https://boostorg.jfrog.io/artifactory/main/release/#https://archives.boost.io/release/#' node_modules/react-native/third-party-podspecs/boost.podspec
      - name: Install Pods
        run: pod install
        working-directory: example/ios
      - name: Build iOS test app
        run: |
          device_name='iPhone 13'
          device=$(xcrun simctl list devices "${device_name}" available | grep "${device_name} (")
          re='\(([-0-9A-Fa-f]+)\)'
          [[ $device =~ $re ]] || exit 1
          xcodebuild -workspace WebviewExample.xcworkspace -scheme ReactTestApp -destination "platform=iOS Simulator,id=${BASH_REMATCH[1]}" CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build
        working-directory: example/ios
    timeout-minutes: 60
