name: macOS
# Discord doesn't ship this fork on macOS, and several webViewKey code paths use UIKit-only APIs
# with no macOS branch, so this build doesn't compile. It only runs when triggered by hand from
# the Actions tab until someone takes on macOS support.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Cache /node_modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
      - name: Install npm dependencies
        run: yarn --frozen-lockfile
      # TODO(rn-upgrade): Remove once the example app is on RN 0.86, which already fixes this.
      # Boost moved its release archives off JFrog, so the old URL in this podspec
      # no longer serves the tarball and pod install fails the checksum check.
      - name: Point boost podspec at archives.boost.io
        run: sed -i '' 's#https://boostorg.jfrog.io/artifactory/main/release/#https://archives.boost.io/release/#' node_modules/react-native-macos/third-party-podspecs/boost.podspec
      # TODO(rn-upgrade): Remove once the example app is on RN 0.86, which already fixes this.
      # Newer Xcode warns about bitwise | on booleans, and Yoga's podspec builds with
      # -Werror, so two hadOverflow() lines in RN 0.68's Yoga break the build.
      - name: Fix Yoga bitwise-or for current Xcode
        run: sed -i '' 's/getLayout().hadOverflow() |$/getLayout().hadOverflow() ||/' node_modules/react-native-macos/ReactCommon/yoga/yoga/Yoga.cpp
      - name: Install Pods
        run: pod install
        working-directory: example/macos
      # TODO(rn-upgrade): Remove once the example app is on RN 0.86, which already fixes this.
      # Boost 1.76 uses std::unary_function, which Xcode 16's libc++ drops in C++17
      # mode. This define brings it back for every target, and $(inherited) keeps
      # each target's own preprocessor definitions.
      - name: Build macOS test app
        run: |
          xcodebuild -workspace WebviewExample.xcworkspace -scheme ReactTestApp CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO GCC_PREPROCESSOR_DEFINITIONS='$(inherited) _LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION' build
        working-directory: example/macos
    timeout-minutes: 60
